<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santo Rosario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: tierno, recogido, sereno; pocas palabras, mucho aire.
   IDEA: un rosario real en la mano: cada toque pasa una cuenta.
   PICTURE: el rosario completo en SVG, la cuenta actual encendida en rosa.
   COLOUR and TYPE: azul mariano profundo + blanco + rosa; EB Garamond para las oraciones, Figtree para controles.
   LAYOUT: banda azul con el rosario, tarjeta de oración debajo (o al lado en pantallas anchas), botones fijos abajo. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0a1230);--ink:light-dark(#14203f,#e9eefb);--soft:light-dark(#5a6785,#9fb0d6);--line:light-dark(#e3e8f3,#22305e);--blue:light-dark(#1a3473,#12215a);--rose:light-dark(#d63a6f,#f06b98);--chip:light-dark(#eef2fa,#16234f);--wash:light-dark(#fdf0f4,#1c1f4a);--ps:20px}
:root[data-set=goz]{--blue:#6e1d40;--rose:light-dark(#d63a6f,#f06b98)}
:root[data-set=dol]{--blue:#4a0f1c;--rose:light-dark(#b8323a,#f0716f)}
:root[data-set=lum]{--blue:#4a3510;--rose:light-dark(#b07415,#e9b14a)}
:root[data-set=glo]{--blue:#15306b;--rose:light-dark(#b8861c,#e8bd52)}
:root{--wash:color-mix(in srgb,var(--rose) 9%,var(--bg))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body,.panel,.nav{transition:background-color .5s}
.card.in-f>*{animation:inF .38s cubic-bezier(.2,.7,.2,1) both}.card.in-b>*{animation:inB .38s cubic-bezier(.2,.7,.2,1) both}
.card>*:nth-child(2){animation-delay:.04s}.card>*:nth-child(3){animation-delay:.08s}
@keyframes inF{from{opacity:0;transform:translateX(22px)}}@keyframes inB{from{opacity:0;transform:translateX(-22px)}}
.hero{text-align:center;padding:4px 0 10px}.hero h2{margin:8px 0 4px;font-size:40px}
.emb{width:112px;height:112px;display:block;margin:0 auto}
.sub{font:italic 400 19px/1.3 "EB Garamond",serif;color:var(--soft);margin:0}
.mlist{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px}
.mlist button{width:100%;display:flex;align-items:center;gap:14px;text-align:start;min-height:56px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font:500 16px/1.3 Figtree,sans-serif;transition:border-color .2s,background .2s}
.mlist button:hover{border-color:var(--rose);background:var(--wash)}
.mlist b{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--rose);color:#fff;font-weight:700}
.int{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px Figtree,sans-serif}
.intent{font:italic 19px/1.4 "EB Garamond",serif;color:var(--soft)}
.nav button:active{transform:scale(.98)}
.quote p{font-family:"EB Garamond",serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.prog{height:4px;background:var(--line)}.prog i{display:block;height:100%;width:0;background:var(--rose);transition:width .3s}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px max(4vw,16px)}
h1{font:600 30px/1.05 "EB Garamond",serif;margin:0}
.day{color:var(--soft);font-size:14px;margin:2px 0 0}
.frase{font:italic 400 16px/1.35 "EB Garamond",serif;margin:6px 0 0;max-width:52ch}.frase small{font:500 12px Figtree,sans-serif;color:var(--soft);font-style:normal;white-space:nowrap}
.wrap{display:grid;grid-template-columns:minmax(0,1fr)}
.panel{background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--rose) 38%,var(--blue)) 0,var(--blue) 68%);display:flex;align-items:center;justify-content:center;padding:14px;height:32vh;min-height:210px;max-height:300px}
.panel svg{height:100%;width:auto;max-width:100%;overflow:visible}
.bead{cursor:pointer;transition:opacity .25s}
.bead.up{opacity:.42}
.bead.cur{fill:color-mix(in srgb,var(--rose) 40%,#fff)!important;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 2px var(--rose))}
.ring{fill:none;stroke:#ffd0e0;stroke-width:2;opacity:0;pointer-events:none}
.ring.on{opacity:1;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.25}}
.card{padding:22px max(5vw,18px) 120px;max-width:760px;width:100%;margin:0 auto}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--soft);font-size:14px;font-weight:500}
.dots{display:flex;gap:5px}.dots b{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots b.f{background:var(--rose)}
h2{font:600 34px/1.05 "EB Garamond",serif;margin:6px 0 14px;text-wrap:balance}
.txt{font:400 var(--ps)/1.5 "EB Garamond",serif;max-width:62ch}
.txt p{margin:0 0 .7em}
.txt hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.lbl{font:600 14px Figtree,sans-serif;color:var(--rose);margin:0 0 .3em!important}
.myst{font-size:1.3em;font-weight:600;color:var(--rose);line-height:1.2}
.quote{background:var(--wash);border-radius:14px;padding:14px 16px;margin:0 0 1em}
.quote p{font-style:italic;margin:0}.quote .cite{font-style:normal;color:var(--soft);font-size:.8em;margin-top:6px}
.cite{color:var(--soft)}
.fruto{font:500 15px Figtree,sans-serif;color:var(--soft)}
.lit{list-style:none;padding:0;margin:0}.lit li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.lit li span{color:var(--soft);font-style:italic}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px max(4vw,16px) calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:5}
.nav button{min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--chip);font-weight:600;font-size:17px}
#prev{flex:1}#next{flex:2.4;background:var(--rose);border-color:var(--rose);color:#fff}
#prev:disabled{opacity:.4;cursor:default}
details.set{position:relative;flex:none}
summary{list-style:none;min-height:44px;display:flex;align-items:center;padding:0 16px;border-radius:12px;background:var(--chip);font-weight:600;font-size:15px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.sheet{position:absolute;right:0;top:52px;width:min(350px,92vw);max-height:75vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;z-index:10;box-shadow:0 12px 40px rgba(10,18,48,.25)}
.sheet h3{font-size:13px;color:var(--soft);font-weight:600;margin:14px 0 6px}.sheet h3:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--chip);font-size:15px}
.chips button[aria-pressed=true]{background:var(--rose);border-color:var(--rose);color:#fff}
.tog{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;line-height:1.3}
.tog input{width:22px;height:22px;flex:none;accent-color:var(--rose)}
.done{text-align:center;padding-top:20px}.done .quote{text-align:start}
@media(min-width:820px){
 .wrap{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}
 .panel{max-height:none;position:sticky;top:0;align-self:start;height:calc(100vh - 170px)}
 .card{padding-top:40px}
 h2{font-size:44px}
}
@media(prefers-reduced-motion:reduce){.ring.on{animation:none}.prog i,.bead{transition:none}}
</style>
</head>
<body>
<div class="prog"><i id="bar"></i></div>
<header>
 <div><h1>Santo Rosario</h1><p class="day" id="day"></p></div>
 <details class="set" id="set">
  <summary>Ajustes</summary>
  <div class="sheet">
   <h3>Misterios</h3>
   <div class="chips" id="sets"></div>
   <h3>Después de cada decena</h3>
   <label class="tog"><input type="checkbox" id="fat"> Oración de Fátima</label>
   <div id="jacs"></div>
   <h3>Al final del Rosario</h3>
   <label class="tog"><input type="checkbox" id="lit"> Letanías de la Virgen</label>
   <label class="tog"><input type="checkbox" id="mig"> Oración a San Miguel Arcángel</label>
   <h3>Tamaño del texto</h3>
   <div class="chips"><button id="tm" aria-label="Texto más pequeño">A−</button><button id="tp" aria-label="Texto más grande">A+</button></div>
   <h3>Rosario</h3>
   <div class="chips"><button id="reset">Empezar de nuevo</button></div>
  </div>
 </details>
</header>
<div class="wrap">
 <div class="panel"><svg id="ros" viewBox="0 0 300 480" role="img" aria-label="Rosario: la cuenta encendida es la oración actual. Toca una cuenta para ir a ella."></svg></div>
 <main class="card" id="card" aria-live="polite"></main>
</div>
<nav class="nav"><button id="prev">Anterior</button><button id="next">Siguiente</button></nav>

["Dichosos los pobres de espíritu, porque de ellos es el Reino de los cielos.","Mt 5, 3","El Reino de Dios no pertenece a los que lo tienen todo resuelto, sino a quienes se saben necesitados. Reconocer tu pequeñez no es humillación: es la puerta de la alegría. Pide la gracia de depender de Dios con confianza de niño."],

["La Transfiguración del Señor","el deseo de santidad",[

["El que quiera venir detrás de mí, que renuncie a sí mismo, cargue con su cruz y me siga.","Mt 16, 24","Seguir a Jesús no nos libra de la cruz, pero nos asegura que nunca la llevaremos solos. Él camina delante, abriendo el paso. Pídele que tu cruz de hoy no te aleje de Él, sino que te una más a su corazón."],

["Padre, en tus manos encomiendo mi espíritu.","Lc 23, 46","Jesús muere entregándose con confianza total al Padre. Su muerte no es derrota, sino el acto de amor más grande de la historia. Pide la gracia de vivir y de morir así: abandonado en las manos de Dios."]]]

["Hombres de Galilea, ¿qué hacen ahí mirando al cielo?","Hch 1, 11","La esperanza del cielo no nos saca del mundo; nos compromete con él. Los ángeles invitan a los discípulos a ponerse en marcha. Que la certeza de la vida eterna te dé fuerzas para amar y servir aquí, ahora."]]],

["Todos perseveraban unánimes en la oración, junto con María, la madre de Jesús.","Hch 1, 14","El Espíritu llega a una comunidad que ora unida, con María en el centro. Ella sigue reuniendo a la Iglesia en oración. Al rezar el Rosario, te unes a esa misma espera. Pide un nuevo Pentecostés para tu familia."],
["El amor de Dios ha sido derramado en nuestros corazones por el Espíritu Santo.","Rm 5, 5","El Espíritu no es una idea lejana: es el Amor mismo de Dios viviendo en ti. Él consuela, ilumina y da fuerza. Pídele sus dones —sabiduría, fortaleza, consejo— para las decisiones y los retos de este día."]]],
["La Asunción de María al cielo","la gracia de una buena muerte",[

["El Poderoso ha hecho obras grandes en mí; su nombre es santo.","Lc 1, 49","La gloria de María es obra de Dios en un corazón humilde. Lo que hizo en ella quiere hacerlo también en ti, si se lo permites. Pídele a la Virgen la gracia de vivir de tal modo que tu vida sea, también, una obra de Dios."],

function emblem(k){
 const pt=(r,a)=>`${(60+r*Math.cos(a)).toFixed(1)},${(60+r*Math.sin(a)).toFixed(1)}`;
 const st='stroke="var(--rose)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"',fl='fill="color-mix(in srgb,var(--rose) 22%,transparent)"';
 const rays=(n,a,b)=>Array.from({length:n},(_,i)=>{const t=i*2*Math.PI/n;return`<line x1="${pt(a,t).split(",")[0]}" y1="${pt(a,t).split(",")[1]}" x2="${pt(b,t).split(",")[0]}" y2="${pt(b,t).split(",")[1]}" stroke="var(--rose)" stroke-opacity=".35" stroke-width="1.5"/>`}).join("");
 let s="";
 if(k==="goz"){s=rays(16,40,56)+`<polygon points="${Array.from({length:16},(_,i)=>pt(i%2?13:34,i*Math.PI/8-Math.PI/2)).join(" ")}" ${st} ${fl}/>`}
 else if(k==="dol"){s=`<polyline points="${Array.from({length:49},(_,i)=>pt(i%2?36:44,i*Math.PI/24)).join(" ")}" fill="none" ${st}/><path d="M55 24h10v22h18v10H65v40H55V56H37V46h18z" ${st} ${fl}/>`}
 else if(k==="lum"){s=rays(14,30,56)+`<path d="M60 22c12 16 14 28 0 44c-14-16-12-28 0-44z" ${st} ${fl}/><rect x="53" y="70" width="14" height="32" rx="3" ${st} ${fl}/>`}
 else{s=Array.from({length:12},(_,i)=>{const t=Math.PI+(i+.5)*Math.PI/12;return`<circle cx="${pt(48,t).split(",")[0]}" cy="${pt(48,t).split(",")[1]}" r="3" fill="var(--rose)"/>`}).join("")+`<path d="M28 88l4-34l14 14l14-22l14 22l14-14l4 34z" ${st} ${fl}/><line x1="28" y1="96" x2="92" y2="96" ${st}/>`}
 return`<svg viewBox="0 0 120 120" class="emb" aria-hidden="true">${s}</svg>`;
}

/* geometría del rosario */
const G={},N=55,cx=150,cy=158,R=124;
for(let i=0;i<N;i++){const a=Math.PI/2+i*2*Math.PI/N;G["p"+i]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a),r:i===0?0:(i%11===0?7.5:5)}}
G.L2={x:150,y:316,r:7.5};G.s0={x:150,y:337,r:5};G.s1={x:150,y:354,r:5};G.s2={x:150,y:371,r:5};G.L1={x:150,y:393,r:7.5};

let steps=[],first={},last={};
function build(){
 steps=[];const A=o=>steps.push(o);
 A({b:"",k:"inicio",t:""});
 A({b:"cross",k:"senal",t:"Señal de la cruz"});
 A({b:"cross",k:"credo",t:"Credo"});
 A({b:"L1",k:"pn",t:"Padre Nuestro"});
 ["por la fe","por la esperanza","por la caridad"].forEach((v,i)=>A({b:"s"+i,k:"am",t:"Ave María",n:i+1,of:3,sub:v}));
 A({b:"L2",k:"gloria",t:"Gloria",ini:1});
 for(let d=0;d<5;d++){
  const ann=d===0?"L2":"p"+11*d, gb=d<4?"p"+11*(d+1):"p0";
  A({b:ann,k:"mist",d,t:ORD[d]+" misterio "+M[st.set].adj});
  A({b:ann,k:"pn",t:"Padre Nuestro",d});
  for(let j=0;j<10;j++)A({b:"p"+(1+11*d+j),k:"am",t:"Ave María",n:j+1,of:10,d});
  A({b:gb,k:"gloria",t:"Gloria",d});
 }
 A({b:"p0",k:"salve",t:"La Salve"});
 if(st.lit)A({b:"p0",k:"lit",t:"Letanías de la Virgen"});
 A({b:"p0",k:"final",t:"Oración final"});
 if(st.mig)A({b:"p0",k:"miguel",t:"Oración a San Miguel Arcángel"});
 A({b:"cross",k:"senal",t:"Señal de la cruz",end:1});
 first={};last={};
 steps.forEach((s,i)=>{if(!s.b)return;if(!(s.b in first))first[s.b]=i;last[s.b]=i});
 if(st.cur>steps.length)st.cur=steps.length;
}

const ros=document.getElementById("ros");
function drawRosary(){
 let h=`<defs><radialGradient id="pearl" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e6ecfa"/><stop offset="1" stop-color="#a9b8de"/></radialGradient></defs>`;
 for(let i=0;i<28;i++){const a=i*Math.PI/14;h+=`<line x1="${(cx+40*Math.cos(a)).toFixed(1)}" y1="${(cy+40*Math.sin(a)).toFixed(1)}" x2="${(cx+104*Math.cos(a)).toFixed(1)}" y2="${(cy+104*Math.sin(a)).toFixed(1)}" stroke="#fff" stroke-opacity="${i%2?.05:.1}" stroke-width="1"/>`}
 h+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#9fb3e6" stroke-opacity=".45" stroke-width="1.2"/>`;
 h+=`<line x1="150" y1="${cy+R}" x2="150" y2="412" stroke="#9fb3e6" stroke-opacity=".45" stroke-width="1.2"/>`;
 for(const id in G){const g=G[id];if(!g.r)continue;
  h+=`<circle class="ring" data-r="${id}" cx="${g.x.toFixed(1)}" cy="${g.y.toFixed(1)}" r="${g.r+5}"/>`;
  h+=`<circle class="bead" data-b="${id}" cx="${g.x.toFixed(1)}" cy="${g.y.toFixed(1)}" r="${g.r}" fill="url(#pearl)"><title>Ir a esta cuenta</title></circle>`;}
 const m=G.p0;
 h+=`<ellipse class="ring" data-r="p0" cx="150" cy="${m.y}" rx="16" ry="20"/>`;
 h+=`<g class="bead" data-b="p0"><ellipse cx="150" cy="${m.y}" rx="11" ry="14" fill="url(#pearl)" stroke="#c9d4f0" stroke-width="1.5"/><text x="150" y="${m.y+5}" text-anchor="middle" font-family="EB Garamond,serif" font-size="15" font-weight="600" fill="#1a3473">M</text><title>Medalla</title></g>`;
 h+=`<rect class="ring" data-r="cross" x="128" y="404" width="44" height="72" rx="8"/>`;
 h+=`<path class="bead" data-b="cross" d="M146 412h8v16h14v8h-14v34h-8v-34h-14v-8h14z" fill="url(#pearl)" stroke="#c9d4f0" stroke-width="1"><title>Crucifijo</title></path>`;
 ros.innerHTML=h;
}

   if(!s.ini&&st.jacs.length)h+=`<hr><p class="lbl">Jaculatorias</p>`+st.jacs.slice().sort().map(i=>`<p>${JAC[i]}</p>`).join("");
   return h}
  case"salve":return paras(P.salve)+`<p class="cite">℣. Ruega por nosotros, santa Madre de Dios.<br>℟. Para que seamos dignos de alcanzar las promesas de nuestro Señor Jesucristo. Amén.</p>`;
  case"lit":return`<ul class="lit">${KY.map(([a,b])=>`<li>${a}<span>${b}</span></li>`).join("")}${LM.map(a=>`<li>${a}<span>ruega por nosotros</span></li>`).join("")}${AG.map(b=>`<li>Cordero de Dios, que quitas el pecado del mundo<span>${b}</span></li>`).join("")}</ul>`;
  default:return paras(P[s.k]);
 }
}
function meta(s){
 let m="";
 if(s.d!==undefined)m+=`Decena ${s.d+1} de 5`;
 else if(s.end)m+="Para terminar";
 else if(steps.indexOf(s)<8)m+="Oraciones iniciales";
 else m+="Oraciones finales";
 if(s.k==="mist")m+=" · Reflexión de hoy";
 if(s.k==="am"){m+=` · ${s.n} de ${s.of}${s.sub?" — "+s.sub:""}`;
  m+=`<span class="dots">${Array.from({length:s.of},(_,i)=>`<b class="${i<s.n?"f":""}"></b>`).join("")}</span>`}
 return m;
}
function render(){
 document.documentElement.style.setProperty("--ps",st.ps+"px");
 document.getElementById("day").textContent=`${DAYS[today]} · Misterios ${M[st.set].n}`+(st.set!==BYDAY[today]?" (elegidos por ti)":"");
 document.querySelectorAll("#sets button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===st.set));
 document.getElementById("fat").checked=st.fat;document.getElementById("lit").checked=st.lit;document.getElementById("mig").checked=st.mig;
 document.querySelectorAll("#jacs input").forEach(c=>c.checked=st.jacs.includes(+c.dataset.j));
 const prev=document.getElementById("prev"),next=document.getElementById("next");
 bar.style.width=(st.cur/steps.length*100)+"%";
 const s=steps[st.cur];
 document.querySelectorAll(".bead").forEach(e=>{const id=e.dataset.b;e.classList.remove("cur","up");
  if(s&&id===s.b)e.classList.add("cur");else if(s&&(first[id]>st.cur||id==="cross"))e.classList.add("up")});
 document.querySelectorAll(".ring").forEach(e=>e.classList.toggle("on",!!s&&e.dataset.r===s.b));
 document.documentElement.dataset.set=st.set;
 const anim=()=>{card.classList.remove("in-f","in-b");if(RM)return;void card.offsetWidth;card.classList.add(dir>0?"in-f":"in-b")};
 if(!s){card.innerHTML=`<div class="done">${emblem(st.set)}<h2>Rosario completado</h2><p class="sub">Misterios ${M[st.set].n}</p><div class="txt" style="margin:18px auto 0"><p class="intent" id="intOut"></p><div class="quote"><p>«${fr[0]}»</p><p class="cite">${fr[1]}</p></div><p>Que la Virgen María te acompañe hoy y siempre.</p></div></div>`;
  const io=document.getElementById("intOut");io.textContent=st.int.trim()?"Ofrecido por: "+st.int.trim():"";if(!st.int.trim())io.remove();
  prev.disabled=false;next.textContent="Rezar de nuevo";anim();save();return}
 if(s.k==="inicio"){const S=M[st.set];
  card.innerHTML=`<div class="hero">${emblem(st.set)}<p class="meta" style="justify-content:center">${DAYS[today]}</p><h2>Misterios ${S.n}</h2><p class="sub">${S.sub}</p></div>
  <div class="quote"><p>«${fr[0]}»</p><p class="cite">${fr[1]}</p></div>
  <p class="lbl">Los cinco misterios</p>
  <ol class="mlist">${S.l.map((m,i)=>`<li><button data-m="${i}"><b>${i+1}</b><span>${m[0]}</span></button></li>`).join("")}</ol>
  <label class="lbl" for="int">Mi intención</label><input id="int" class="int" maxlength="160" placeholder="Por quién o por qué ofreces este Rosario">`;
  document.getElementById("int").value=st.int;
  prev.disabled=true;next.textContent="Comenzar el Rosario";anim();save();return}
 card.innerHTML=`<div class="meta">${meta(s)}</div><h2>${s.t}</h2><div class="txt">${body(s)}</div>`;
 prev.disabled=st.cur===0;
 next.textContent=st.cur===steps.length-1?"Terminar":"Siguiente";
 anim();save();
}
function go(i){i=Math.max(0,Math.min(steps.length,i));dir=i>=st.cur?1:-1;st.cur=i;render();
 try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
 const t=card.getBoundingClientRect().top;if(t<0||t>innerHeight*.65)window.scrollTo({top:Math.max(0,scrollY+t-8),behavior:RM?"auto":"smooth"})}
const nextFn=()=>{if(st.cur>=steps.length){dir=1;st.cur=0;render();window.scrollTo({top:0,behavior:RM?"auto":"smooth"});return}go(st.cur+1)};
card.addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b)go(steps.findIndex(s=>s.k==="mist"&&s.d===+b.dataset.m))});
card.addEventListener("input",e=>{if(e.target.id==="int"){st.int=e.target.value;save()}});
document.getElementById("sets").innerHTML=Object.keys(M).map(k=>`<button data-s="${k}">${M[k].n}</button>`).join("");
document.getElementById("jacs").innerHTML=JAC.map((j,i)=>`<label class="tog"><input type="checkbox" data-j="${i}"> ${j.split(" — ")[0]}</label>`).join("");
document.getElementById("sets").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.set=b.dataset.s;build();render()});
document.getElementById("jacs").addEventListener("change",e=>{const j=+e.target.dataset.j;st.jacs=e.target.checked?[...new Set([...st.jacs,j])]:st.jacs.filter(x=>x!==j);render()});
document.getElementById("fat").addEventListener("change",e=>{st.fat=e.target.checked;render()});
document.getElementById("lit").addEventListener("change",e=>{st.lit=e.target.checked;build();render()});
document.getElementById("mig").addEventListener("change",e=>{st.mig=e.target.checked;build();render()});
document.getElementById("tm").addEventListener("click",()=>{st.ps=Math.max(16,st.ps-2);render()});
document.getElementById("tp").addEventListener("click",()=>{st.ps=Math.min(32,st.ps+2);render()});
document.getElementById("reset").addEventListener("click",()=>{st.cur=0;document.getElementById("set").open=false;render();window.scrollTo({top:0})});
document.getElementById("next").addEventListener("click",nextFn);
document.getElementById("prev").addEventListener("click",()=>go(st.cur>=steps.length?steps.length-1:st.cur-1));
ros.addEventListener("click",e=>{const b=e.target.closest("[data-b]");if(b&&b.dataset.b in first)go(first[b.dataset.b])});
document.addEventListener("keydown",e=>{if(e.target.closest("input,summary,.sheet"))return;
 if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();nextFn()}else if(e.key==="ArrowLeft"){e.preventDefault();if(st.cur>0)go(st.cur-1)}});
let tx=null,ty=0;
card.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
card.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
 if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?nextFn():(st.cur>0&&go(st.cur-1))}});

build();drawRosary();render();
}
</script>
</body>
</html>
